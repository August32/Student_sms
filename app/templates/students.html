<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生管理 | Wolin SMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='app.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark app-navbar"><div class="container-fluid px-4"><a class="navbar-brand fw-semibold" href="/">Wolin SMS</a><div class="d-flex gap-3 flex-wrap"><a class="nav-link text-white" href="/">学生</a><a class="nav-link text-white" href="/classes">班级</a><a class="nav-link text-white" href="/teachers">老师</a><a class="nav-link text-white" href="/scores">成绩</a><a class="nav-link text-white" href="/employment-page">就业</a><a class="nav-link text-white" href="/statistics">统计</a></div></div></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="eyebrow mb-1">STUDENT DIRECTORY</p><h1 class="h3 mb-1">学生管理</h1><p class="text-secondary mb-0">维护学生基本信息，数据直接同步现有学生 API。</p></div><button class="btn btn-primary" id="addStudentBtn">＋ 新增学生</button></div>
  <div id="alertBox" class="alert d-none" role="alert"></div>
  <section class="card border-0 shadow-sm mb-4"><div class="card-body p-4"><form id="filterForm" class="row g-3 align-items-end">
    <div class="col-12 col-md-2"><label class="form-label">学生编号</label><input type="number" min="1" class="form-control" id="filterId" placeholder="精确匹配"></div>
    <div class="col-12 col-md-3"><label class="form-label">姓名</label><input class="form-control" id="filterName" placeholder="支持模糊搜索"></div>
    <div class="col-12 col-md-3"><label class="form-label">班级</label><select class="form-select" id="filterClass"><option value="">全部班级</option></select></div>
    <div class="col-12 col-md-4 d-flex gap-2"><button class="btn btn-dark flex-grow-1" type="submit">查询学生</button><button class="btn btn-outline-secondary" type="button" id="resetBtn">重置</button></div>
  </form></div></section>
  <section class="card border-0 shadow-sm"><div class="card-header bg-white border-0 p-4 pb-2 d-flex justify-content-between align-items-center"><div><h2 class="h5 mb-1">学生列表</h2><span class="text-secondary small" id="resultHint">正在加载…</span></div><div class="spinner-border spinner-border-sm text-primary d-none" id="loading"></div></div>
    <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>编号</th><th>姓名</th><th>班级</th><th>性别</th><th>年龄</th><th>学历</th><th>专业</th><th class="text-end">操作</th></tr></thead><tbody id="studentRows"><tr><td colspan="8" class="text-center text-secondary py-5">正在加载学生数据…</td></tr></tbody></table></div>
  </section>
</main>
<div class="modal fade" id="studentModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content border-0 shadow"><form id="studentForm"><div class="modal-header"><div><h5 class="modal-title" id="modalTitle">新增学生</h5><p class="text-secondary small mb-0">带 * 的字段为必填项</p></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="studentId"><div class="row g-3">
  <div class="col-md-6"><label class="form-label">姓名 *</label><input required class="form-control" id="name"></div><div class="col-md-6"><label class="form-label">所属班级</label><select class="form-select" id="classId"><option value="">未分配班级</option></select></div>
  <div class="col-md-4"><label class="form-label">性别</label><select class="form-select" id="gender"><option value="">未填写</option><option value="男">男</option><option value="女">女</option></select></div><div class="col-md-4"><label class="form-label">年龄</label><input type="number" min="1" class="form-control" id="age"></div><div class="col-md-4"><label class="form-label">学历</label><input class="form-control" id="education"></div>
  <div class="col-md-6"><label class="form-label">入学时间</label><input type="date" class="form-control" id="enrollTime"></div><div class="col-md-6"><label class="form-label">毕业时间</label><input type="date" class="form-control" id="graduateTime"></div><div class="col-md-6"><label class="form-label">籍贯</label><input class="form-control" id="nativePlace"></div><div class="col-md-6"><label class="form-label">顾问编号</label><input class="form-control" id="consultantNo"></div><div class="col-md-6"><label class="form-label">毕业院校</label><input class="form-control" id="graduateSchool"></div><div class="col-md-6"><label class="form-label">专业</label><input class="form-control" id="major"></div>
  </div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit">保存学生</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static', path='students.js') }}"></script>
</body></html>
